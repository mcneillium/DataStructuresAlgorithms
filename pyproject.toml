[project]
name = "data-structures-algorithms"
version = "1.2.0"
description = "A binary search tree, a graph with breadth-first search and a hash table, from scratch, with a Tkinter GUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern-syntax upgrades, likely bugs, simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is left to the formatter; long GUI strings are not worth wrapping by hand.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# The three data structures are fully typed; the Tkinter GUI is not checked.
files = ["trees", "graphs", "hash_tables"]
strict = true
